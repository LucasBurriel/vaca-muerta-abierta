name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      # F4: the agent end to end on the committed site/data/ snapshot, no model, no key (ADR-028)
      - run: python agente.py --proveedor mock --fuente json --json "¿Qué operadora tiene la mejor mediana de IP90 por metro en Vaca Muerta, ventana de petróleo, cohorte 2024?"
      - run: python agente.py --proveedor mock-sin-cita --fuente json --silencioso "curva tipo de Vaca Muerta 2022 en petróleo"
