<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador de campaña</title>
<!--BASE_CSS-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js" integrity="sha512-k37wQcV4v2h6jgYf5IUz1MoSKPpDs630XGSmCaCCOXxy2awgAWKHGZWr9nMyGgk3IOxA1NxdkN8r1JHgkUtMoQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<!--PUENTE-->
</head>
<body>
<h1 id="titulo">Simulador de campaña</h1>
<p class="sub" id="sub">Esperando el resultado de <code>simular_campania</code>…</p>
<div class="aviso">Análisis de curvas de declinación sobre datos públicos, no simulación de reservorio: la banda es la dispersión publicada entre pozos, sin interferencia, instalaciones ni precio (<code>docs/simulacion.md</code>).</div>
<form class="controles" id="form" onsubmit="return false">
  <div><label>pozos</label><input type="number" id="n_pozos" min="1" max="500" step="1"></div>
  <div><label>meses</label><input type="number" id="meses" min="12" max="360" step="12"></div>
  <div><label>rama (m)</label><input type="number" id="rama_m" min="0" max="6000" step="100"></div>
  <div><label>pozos por mes</label><input type="number" id="ritmo" min="1" max="500" step="1"></div>
  <div><label>uptime</label><input type="number" id="uptime" min="0.5" max="1" step="0.01"></div>
  <div><label>ventana</label><select id="ventana"><option value="">(todas)</option><option value="petroleo">petróleo</option><option value="volatil_condensado">volátil / condensado</option><option value="gas">gas</option></select></div>
  <div><label>cohorte ref.</label><input type="number" id="cohorte_ref" min="2010" max="2030" step="1"></div>
  <div><button id="correr">Volver a simular</button></div>
</form>
<div class="fila" id="tarjetas"></div>
<div id="g_tasa" class="grafico"></div>
<div id="g_acum" class="grafico" style="height:260px"></div>
<p class="nota" id="notas"></p>
<div class="cita" id="cita"></div>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  let c1 = null, c2 = null, args = {};
  function tarjeta(k, v) { return `<div class="tarjeta"><div class="k">${k}</div><div class="v">${v}</div></div>`; }
  function llenar(a) {
    args = Object.assign({}, args, a || {});
    $("n_pozos").value = args.n_pozos ?? 10; $("meses").value = args.meses ?? 120; $("rama_m").value = args.rama_m ?? "";
    $("ritmo").value = args.ritmo_pozos_por_mes ?? ""; $("uptime").value = args.uptime ?? 0.92; $("ventana").value = args.ventana ?? ""; $("cohorte_ref").value = args.cohorte_ref ?? "";
  }
  function banda(xs, b, color, nombre) {
    return [
      { name: nombre + " P90", type: "line", data: b.p90.map((v, i) => [xs[i], v]), showSymbol: false, lineStyle: { opacity: 0 }, stack: nombre, areaStyle: { opacity: 0 }, silent: true },
      { name: nombre + " P10–P90", type: "line", data: b.p10.map((v, i) => [xs[i], v - b.p90[i]]), showSymbol: false, lineStyle: { opacity: 0 }, stack: nombre, areaStyle: { color, opacity: 0.18 } },
      { name: nombre + " P50", type: "line", data: b.p50.map((v, i) => [xs[i], v]), showSymbol: false, lineStyle: { width: 2.5, color }, itemStyle: { color } },
    ];
  }
  function render(env) {
    if (!env || env.error) { $("sub").textContent = "Error: " + ((env && env.error) || "sin datos"); $("correr").disabled = false; return; }
    const d = env.datos, g = d.grupo, f = d.final;
    llenar({ n_pozos: d.n_pozos, meses: d.meses, rama_m: d.rama_m, ritmo_pozos_por_mes: d.ritmo_pozos_por_mes, uptime: d.uptime, ventana: g.ventana, cohorte_ref: g.cohorte_ref, formacion: g.formacion, tasa: d.tasa, n_sim: d.n_sim });
    $("titulo").textContent = `Campaña de ${d.n_pozos} pozos · ${g.formacion}${g.ventana ? " · " + g.ventana : ""} · curva ${g.cohorte_ref}`;
    $("sub").innerHTML = `<code>${g.curva}</code> · ${d.n_sim} corridas · ${d.meses_curva_publicados} meses publicados${d.meses_extrapolados ? " + " + d.meses_extrapolados + " extrapolados" : ""}${d.escala_por_metro ? " · escala por rama " + VMA.fmt(d.rama_m) + " m" : ""}`;
    const u = d.unidad_volumen;
    $("tarjetas").innerHTML =
      tarjeta(`acumulado ${d.meses} m · P50`, `${VMA.fmt(f.acumulado_p50, 3)} ${u}`) +
      tarjeta("P10 / P90", `${VMA.fmt(f.acumulado_p10, 3)} / ${VMA.fmt(f.acumulado_p90, 3)}`) +
      tarjeta("por pozo P50", `${VMA.fmt(f.por_pozo_p50, 3)} ${u}`) +
      tarjeta("tasa pico P50", `${VMA.fmt(f.tasa_pico_p50, 3)} ${d.tasa.replace("_d", "/d").replace("_m3", " m³").replace("_mil", " mil")} (mes ${f.mes_pico_p50})`);
    const xs = d.mes;
    const dark = (VMA.ctx.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark";
    c1 = c1 || echarts.init($("g_tasa"), dark ? "dark" : null);
    c2 = c2 || echarts.init($("g_acum"), dark ? "dark" : null);
    const base = { backgroundColor: "transparent", animation: false, grid: { left: 70, right: 20, top: 30, bottom: 36 }, tooltip: { trigger: "axis", valueFormatter: (v) => VMA.fmt(v, 3) }, xAxis: { type: "value", name: "mes de campaña", nameLocation: "middle", nameGap: 24, min: 0, max: d.meses - 1 } };
    c1.setOption(Object.assign({}, base, { legend: { top: 0, data: ["tasa agregada P50", "tasa agregada P10–P90"] }, yAxis: { type: "value", name: d.tasa }, series: banda(xs, d.tasa_agregada, "#b5451b", "tasa agregada") }), true);
    c2.setOption(Object.assign({}, base, { legend: { top: 0, data: ["acumulado P50", "acumulado P10–P90"] }, yAxis: { type: "value", name: u }, series: banda(xs, d.acumulado, "#1f6fb2", "acumulado").concat([{ name: "pozos en línea", type: "line", yAxisIndex: 0, data: [], showSymbol: false }]) }), true);
    $("notas").innerHTML = (env.notas || []).map((n) => "· " + n).join("<br>");
    const c = env.cita || {};
    $("cita").innerHTML = `Cita: <code>${c.tabla}</code> · filtros ${JSON.stringify(c.filtros)} · ${c.regla_doc} · datos ${env.fecha_datos}, maestro ${env.version_maestro}, fuente ${env.fuente}`;
    $("correr").disabled = false;
  }
  async function correr() {
    const a = {
      formacion: args.formacion || "Vaca Muerta", n_pozos: +$("n_pozos").value, meses: +$("meses").value,
      ventana: $("ventana").value || null, cohorte_ref: $("cohorte_ref").value ? +$("cohorte_ref").value : null,
      rama_m: $("rama_m").value ? +$("rama_m").value : null, ritmo_pozos_por_mes: $("ritmo").value ? +$("ritmo").value : null,
      uptime: +$("uptime").value, tasa: args.tasa || "petroleo_m3_d", n_sim: args.n_sim || 500,
    };
    for (const k in a) if (a[k] === null) delete a[k];
    $("correr").disabled = true;
    try { render(VMA.parse(await VMA.callTool("simular_campania", a))); }
    catch (e) { $("sub").textContent = "El host no permitió la llamada: " + (e.message || JSON.stringify(e)); $("correr").disabled = false; }
  }
  $("correr").addEventListener("click", correr);
  VMA.onInput = (a) => llenar(a);
  VMA.onResult = (res) => render(VMA.parse(res));
  window.addEventListener("resize", () => { c1 && c1.resize(); c2 && c2.resize(); });
  VMA.start();
  llenar({});
  if (!VMA.enHost) $("sub").textContent = "Abierto fuera de un host MCP: no hay resultado que mostrar.";
})();
</script>
</body>
</html>
